plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.1.20'
}

group = 'ic2'
version = '0.70.0'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Compile a separate consumer against the public API; never package example addon classes.
def compileAddonExample = tasks.register('compileAddonExampleJava', JavaCompile) {
    source = fileTree('src/addonExample/java') { include '**/*.java' }
    classpath = sourceSets.main.output + sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('classes/java/addonExample')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.release = 21
}

// Only the explicit client/server runs below are needed; no game-backed JUnit suite exists.
subsystems.conventions.runs.shouldDefaultRunsBeCreated.set(false)

def compileVerification = tasks.register('compileVerificationJava', JavaCompile) {
    source = fileTree('src/verification/java') { include '**/*.java' }
    classpath = sourceSets.main.output
    destinationDirectory = layout.buildDirectory.dir('classes/java/verification')
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    options.release = 21
}

def standaloneChecks = [
    verifyPadUpgrades: 'ic2.core.machine.PadUpgradeRulesTest',
    verifyMachineUpgrades: 'ic2.core.machine.MachineUpgradeRulesTest',
    verifyUtilityCycles: 'ic2.core.machine.UtilityCyclesTest',
    verifyChunkloaderRules: 'ic2.core.machine.ChunkloaderRulesTest',
    verifyColossalCycle: 'ic2.core.machine.ColossalCycleTest',
    verifyStorageControl: 'ic2.core.machine.StorageControlTest',
    verifyInductionCycle: 'ic2.core.machine.InductionCycleTest',
    verifyProcessingLayouts: 'ic2.core.machine.ProcessingLayoutTest',
    verifyRareEarthProgress: 'ic2.core.machine.RareEarthProgressTest',
    verifyElectrolyzerControl: 'ic2.core.machine.ElectrolyzerControlTest',
    verifyRecyclerControl: 'ic2.core.machine.RecyclerControlTest',
    verifyPressureStructure: 'ic2.core.machine.PressureStructureTest',
    verifyAlloyInputs: 'ic2.core.machine.AlloyInputAmountsTest',
    verifySolarTurbineCycle: 'ic2.core.machine.SolarTurbineCycleTest',
    verifySlagGeneratorCycle: 'ic2.core.machine.SlagGeneratorCycleTest',
    verifyEnergyExpansion: 'ic2.core.machine.EnergyExpansionTest',
    verifyAddonRegistry: 'ic2.api.internal.ExtensionRegistryTest',
    verifyGeneratorExpansion: 'ic2.core.machine.GeneratorExpansionTest',
    verifyChemistryCycles: 'ic2.core.machine.ChemistryCycleTest',
    verifyChargingDistribution: 'ic2.core.machine.ChargingDistributionTest',
    verifyReactorRunTotals: 'ic2.core.machine.ReactorRunTotalsTest',
    verifyWindField: 'ic2.core.machine.WindFieldTest',
    verifyMonitorLayout: 'ic2.core.machine.MonitorLayoutTest',
    verifyGenerationSettings: 'ic2.core.machine.GenerationSettingsTest',
    verifyReactorBlastMath: 'ic2.core.machine.ReactorBlastMathTest'
]
standaloneChecks.each { taskName, entryPoint ->
    tasks.register(taskName, Exec) {
        group = 'verification'
        description = "Run ${entryPoint} boundary checks."
        dependsOn compileVerification
        def verificationClasspath = files(compileVerification.flatMap { it.destinationDirectory }, sourceSets.main.output)
        def launcher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        // These checks use only the compiled pure logic, without a game runtime.
        doFirst {
            commandLine launcher.get().executablePath.asFile.absolutePath,
                '-ea', '-cp', verificationClasspath.asPath, entryPoint
        }
    }
}
tasks.named('check') {
    dependsOn standaloneChecks.keySet()
    dependsOn compileAddonExample
}

def neoForgeVersion = '21.1.219'
def jeiVersion = '19.64.0.455'

repositories {
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
}

tasks.named('processResources', ProcessResources) {
    def metadata = [modVersion: project.version, neoForgeVersion: neoForgeVersion]
    inputs.properties(metadata)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(metadata)
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoForgeVersion}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jeiVersion}"
}

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('runs').dir(name)
        modSource project.sourceSets.main
    }

    client {}
    server {
        argument '--nogui'
    }
}
